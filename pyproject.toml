[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-tool"
description = "Small, predictable utilities for working with PDF files. First tool: joining files without editing their contents."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["pdf", "merge", "join", "concatenate", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: General",
]
dependencies = ["pypdf>=4.0"]
dynamic = ["version"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.0", "PySide6>=6.5", "pyinstaller>=6.0", "pyflakes>=3.0"]


[project.scripts]
pdf-join = "pdf_tool.cli:main"
pdf-join-gui = "pdf_tool.gui.app:main"

[tool.setuptools]
packages = ["pdf_tool"]

[tool.setuptools.dynamic]
version = { attr = "pdf_tool.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"
