name: Desktop release

# Desktop distributions are the product.  There is deliberately no PyPI job.
#
# * Every push to main builds a stable release and publishes it to GitHub.
# * Every push to any other branch builds a uniquely versioned beta release.
#
# Change only pdf_tool/version.py for the next stable version.  Branch beta
# numbers are generated from the GitHub Actions run number, so branch builds do
# not edit or commit version files.

on:
  push:
    branches:
      - main
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-build:
    name: stable desktop build (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build the desktop executable
        run: python packaging/build_exe.py --channel stable --dist dist

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: python packaging/build_exe.py --channel stable --installer --dist dist

      - name: Stage uniquely named release assets
        run: python packaging/build_exe.py --channel stable --dist dist --stage release-assets --stage-only

      - uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  stable-publish:
    name: publish stable desktop release
    if: github.ref == 'refs/heads/main'
    needs: stable-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the small runtime dependency set
        run: python -m pip install -r requirements.txt
      - name: Read the single source version
        id: version
        shell: bash
        run: echo "version=$(python -c 'from pdf_tool.version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: stable-*
          merge-multiple: true

      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PDF Tool v${{ steps.version.outputs.version }}
          body: |
            Stable desktop release of PDF Tool.

            Download the asset for your operating system, then drag PDFs into
            the app to join them without changing their page content.
          files: assets/**
          generate_release_notes: true
          prerelease: false
          make_latest: true

  beta-build:
    name: beta desktop build (${{ matrix.os }})
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build and stage beta desktop assets
        run: >-
          python packaging/build_exe.py
          --channel beta
          --build-number "${{ github.run_number }}"
          --dist dist
          --stage release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  beta-publish:
    name: publish beta desktop release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/main'
    needs: beta-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the small runtime dependency set
        run: python -m pip install -r requirements.txt
      - name: Calculate beta version
        id: version
        shell: bash
        run: |
          base=$(python -c 'from pdf_tool.version import __version__; print(__version__)')
          echo "version=${base}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: beta-*
          merge-multiple: true

      - name: Publish beta GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PDF Tool v${{ steps.version.outputs.version }}
          body: |
            Beta desktop build from branch `${{ github.ref_name }}`.

            This build is for testing. Stable releases are produced from main.
          files: assets/**
          generate_release_notes: true
          prerelease: true
          make_latest: false
