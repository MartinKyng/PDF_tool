name: Publish executables

# For every tagged version (e.g. v0.1.0), builds the single-file executables
# (pdf-join, pdf-join-gui) on Windows / macOS / Linux plus the Windows
# installer, then publishes them all to a GitHub Release.
#
# Python wheels are published separately by .github/workflows/release.yml.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write     # create the GitHub release + upload assets

jobs:
  executables:
    name: build exe on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (non-editable so PyInstaller bundles the package)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Install Inno Setup (Windows, for the installer)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build executables (+ Windows installer)
        if: runner.os == 'Windows'
        run: python packaging/build_exe.py --installer

      - name: Build executables
        if: runner.os != 'Windows'
        run: python packaging/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.os }}
          path: dist/*

  publish_release:
    name: publish exes to GitHub release
    runs-on: ubuntu-latest
    needs: executables
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List what will be published
        run: ls -la assets/

      - name: Create / update the GitHub release with the exes
        uses: softprops/action-gh-release@v2
        with:
          files: assets/**
          generate_release_notes: true
