name: Release

# Builds distributables for every tagged version (e.g. v0.1.0) and publishes:
#   * sdist + wheel  -> PyPI (trusted publishing) and GitHub release
#   * single-file executables (pdf-join, pdf-join-gui) -> GitHub release
#
# To enable PyPI trusted publishing, add this repo (owner/name, workflow
# "release.yml") as a trusted publisher on pypi.org. The job fails harmlessly
# until then; the GitHub release is always produced.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write     # create the GitHub release + upload assets
  id-token: write     # PyPI trusted publishing

jobs:
  sdist_wheel:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  executables:
    name: build exe on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (non-editable so PyInstaller bundles the package)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Build single-file executables
        run: python -m PyInstaller packaging/pdf-tool.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.os }}
          path: |
            dist/pdf-join*
            dist/pdf-join-gui*

  publish_release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: [sdist_wheel, executables]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: assets/**
          generate_release_notes: true
