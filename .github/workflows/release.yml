name: Release

# Publishes the Python distribution (sdist + wheel) to PyPI for every tagged
# version (e.g. v0.1.0) using trusted publishing.
#
# The executables are published separately by .github/workflows/publish.yml.
#
# To enable PyPI trusted publishing, add this repo (owner/name, workflow
# "release.yml") as a trusted publisher on pypi.org. The job fails harmlessly
# until then.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write     # PyPI trusted publishing
  contents: read

jobs:
  sdist_wheel:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
